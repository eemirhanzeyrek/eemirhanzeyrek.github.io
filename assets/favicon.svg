<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ez-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
  </defs>
  <!-- Squircle rounded background -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Subtle inner glow -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#ez-grad)" stroke-width="1" stroke-opacity="0.3" />

  <!-- Monogram text 'EZ' -->
  <text x="32" y="41" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" text-anchor="middle" fill="url(#ez-grad)" letter-spacing="-1">EZ</text>
</svg>

